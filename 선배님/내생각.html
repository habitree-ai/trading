<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선배님의 20년 — 내 생각</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">:root{
  --bg:#FCFCFA; --surface:#FFFFFF; --surface-2:#F4F3EF; --line:#E2E0D9; --line-soft:#EDEBE5;
  --ink:#1A1A18; --ink-2:#4A4842; --ink-3:#7C7A72;
  --accent:#B3352C; --accent-soft:#F0DCD9; --accent-ink:#8E2822; --link:#2F5C8F;
  --ok:#2E6B4F; --ok-soft:#DCEBE2;
  --shadow:0 1px 2px rgba(26,26,24,.06),0 10px 30px rgba(26,26,24,.09);
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --sans:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --serif:'Nanum Myeongjo','Batang','Apple SD Gothic Neo',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161A; --surface:#1B1E23; --surface-2:#22262C; --line:#2E333A; --line-soft:#262A30;
  --ink:#E8E6E1; --ink-2:#B2AFA8; --ink-3:#807D76;
  --accent:#E06A5E; --accent-soft:#3A2523; --accent-ink:#F0968C; --link:#7FAADC;
  --ok:#7FC3A0; --ok-soft:#1F332A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1B1E23; --surface-2:#22262C; --line:#2E333A; --line-soft:#262A30;
  --ink:#E8E6E1; --ink-2:#B2AFA8; --ink-3:#807D76;
  --accent:#E06A5E; --accent-soft:#3A2523; --accent-ink:#F0968C; --link:#7FAADC;
  --ok:#7FC3A0; --ok-soft:#1F332A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
#shell{display:contents}

/* ---------- 공통 상단 네비 ---------- */
.nav{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 20px;height:52px;
  border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:40}
.nav .site{font-family:var(--serif);font-weight:800;font-size:16px;letter-spacing:-.01em;margin-right:20px;
  white-space:nowrap;color:var(--ink)}
.nav .site:hover{text-decoration:none}
.nav a.tab,.nav span.tab{display:flex;align-items:center;height:52px;padding:0 15px;font-size:14px;
  color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a.tab:hover{color:var(--ink);text-decoration:none}
.nav .tab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.nav .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.nav .right button,.nav .right a{border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:12px;color:var(--ink-2)}
.nav .right button:hover,.nav .right a:hover{border-color:var(--ink-3);color:var(--ink);text-decoration:none}
.nav .right .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nav .right .primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.nav .badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);
  color:var(--ink-3);border:1px solid var(--line)}
.nav .badge.live{background:var(--ok-soft);color:var(--ok);border-color:transparent}
@media (max-width:720px){
  .nav{padding:0 12px;overflow-x:auto}
  .nav .site{margin-right:10px;font-size:15px}
  .nav a.tab,.nav span.tab{padding:0 11px;font-size:13px}
}

/* ---------- 내 생각 ---------- */
body.notes{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.tbtn{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink-2)}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink);text-decoration:none}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.tbtn[disabled]{opacity:.45;cursor:default}
main.notes{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr)}
nav.rail,section.pane{min-width:0;min-height:0}
nav.rail{border-right:1px solid var(--line);overflow-y:auto;padding-bottom:50px;display:flex;flex-direction:column}
.railtop{position:sticky;top:0;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);z-index:2}
.railtop input{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:7px;
  padding:7px 11px;font-size:13.5px}
.railtop input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.filters{display:flex;gap:5px;margin-top:8px}
.fbtn{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3)}
.fbtn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:500}
.nlist{padding:6px 0}
.nitem{display:block;width:100%;text-align:left;padding:11px 15px;border-bottom:1px solid var(--line-soft);
  border-left:3px solid transparent}
.nitem:hover{background:var(--surface-2)}
.nitem.on{background:var(--accent-soft);border-left-color:var(--accent)}
.nmeta{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.ndate{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ncat{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 5px;
  max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nst{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.nst.done{background:var(--ok-soft);color:var(--ok)}
.ntitle{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.4;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nitem.on .ntitle{color:var(--accent-ink)}
.nsnip{font-size:11.5px;color:var(--ink-3);margin-top:3px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.75}

section.pane{overflow-y:auto}
.wrap{max-width:720px;margin:0 auto;padding:34px 32px 130px}
.src{background:var(--surface-2);border-radius:9px;padding:15px 17px;margin-bottom:30px;border:1px solid var(--line-soft)}
.src .lbl{font-size:10px;letter-spacing:.11em;color:var(--ink-3);text-transform:uppercase;margin-bottom:7px}
.src h2{font-family:var(--serif);font-weight:800;font-size:20px;line-height:1.35;margin:0 0 8px;text-wrap:balance}
.src .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
  border-radius:4px;padding:2px 8px}
.chip.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip.cat{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.src .acts{display:flex;gap:7px;flex-wrap:wrap}
.fld{margin-bottom:26px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;letter-spacing:.01em}
.fld .hint{font-size:11.5px;color:var(--ink-3);margin-bottom:7px;line-height:1.6}
.fld textarea,.fld input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:11px 13px;font-size:14.5px;line-height:1.8;resize:vertical}
.fld textarea:focus,.fld input[type=text]:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea::placeholder,.fld input::placeholder{color:var(--ink-3);line-height:1.7}
.fld.quote textarea{font-family:var(--serif);font-size:15px;background:var(--surface-2);
  border-left:3px solid var(--accent)}
.linkrow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);
  border:1px solid var(--line);border-radius:7px;margin-bottom:6px}
.linkrow .ld{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.linkrow .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.linkrow .x{color:var(--ink-3);font-size:15px;line-height:1;padding:2px 5px}
.linkrow .x:hover{color:var(--accent)}
.pick{position:relative}
.pick input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;font-size:13.5px}
.pick input:focus{outline:none;border-color:var(--accent)}
.res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow);max-height:320px;overflow-y:auto;z-index:20}
.res button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.res button:hover{background:var(--surface-2)}
.res .rd{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.res .rt{font-size:13.5px;font-family:var(--serif);font-weight:700;line-height:1.4}
.res .rc{font-size:10.5px;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:2px 10px;
  display:flex;align-items:center;gap:5px}
.tag button{color:var(--ink-3);font-size:13px;line-height:1}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);
  padding:22px 0 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.savebar .st{font-size:11.5px;color:var(--ink-3);margin-right:auto}
.stat{display:flex;gap:16px;flex-wrap:wrap;padding:14px 15px;background:var(--surface-2);border-radius:9px;
  margin-bottom:26px}
.stat div{display:flex;align-items:baseline;gap:5px}
.stat b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-3)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);opacity:0;
  transition:opacity .18s;pointer-events:none;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.guide{font-size:12.5px;color:var(--ink-3);line-height:1.85;background:var(--surface-2);border-radius:9px;
  padding:14px 16px;margin-bottom:26px}
.guide b{color:var(--ink-2)}
@media (max-width:900px){
  body.notes{height:auto;overflow:visible}
  main.notes{grid-template-columns:minmax(0,1fr)}
  nav.rail{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
  section.pane{overflow:visible}
  .wrap{padding:24px 18px 90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script type="application/json" id="notes">[{"id": "n1", "post": "222284946597", "quote": "거래에 있어서, 레버리지 관리는 시작과 끝이라고 할 만큼 중요한 것인데..\n저는 이토록 날카로운 부분을, 너무 엉성하게 다루고 있었습니다.\n몇년째 저변동성으로 인해서, 수익을 크게 내기 어려운 시장..\n레버리지 증가를 생각할 필요가 없는 수익곡선.\n그 시장에 저는, 이미 많이 익숙해 져버린 상황이었고..\n그리고 그러한 익숙함은, 다른 시장에 대한 준비를 전혀 해 놓지 않은 것입니다.\n\n결국... 익숙함... 그 부분이 또 문제였습니다.\n\n그러나 그렇다고는 해도..\n왜. 굳이.. 아무 생각없이 끄적여뒀던 목표치를 딱 달성시켜서,\n레버리지를 50% 증액 시킨 그 날부터.. 이렇게까지 난타를 당할수 있는것인지..\n그 부분은 좀 당황스러웠습니다.\n\n나를 여기까지 끌고 와준..\n시스템 트레이딩을 얼마나 믿을수 있을것인가?\n왜 하필 내가 설정한 그 목표치. 딱 거기를 찍고..\n이렇게 시장은 변해버린것일까?", "think": "", "apply": "", "differ": "", "ask": "", "links": ["120198179514", "120113073776", "120056775267", "224336949824", "223473658478", "223288561580"], "tags": ["레버리지", "시스템트레이딩", "익숙함", "자만"], "status": "draft", "created": "2026-08-26", "updated": "2026-08-26"}]</script>

function setBusy(b){var el=$('#savebtn'); if(el){el.disabled=b; el.textContent=b?'저장 중…':'저장'}}
function persist(){

      if(c==='not_writer'||c==='not_granted'||c==='not_declared'){
        localMode=true; artifactNS=null; saveLocal(); dirty=false; render();
        toast('읽기 전용 화면이라 이 브라우저에만 저장했습니다.'); return }

    });

}

function toMD(){
  var L=['# 내 생각 — 선배님 블로그 아카이브','','원문 760편(2006~2026) 기준. 내보낸 날짜: '+today(),'','---',''];
  NOTES.slice().sort(function(a,b){
    var da=PMAP[a.post]?PMAP[a.post].d:'0', db=PMAP[b.post]?PMAP[b.post].d:'0';
    return da<db?-1:da>db?1:0}).forEach(function(n){
    var p=PMAP[n.post];
    L.push('## '+(p?p.t:'(글 미지정)'),'');
    if(p) L.push('- 원문: ['+p.d+' · '+p.c+' · '+p.t+']('+p.u+')');
    L.push('- 상태: '+(n.status==='done'?'정리됨':'초안')+' · 작성 '+(n.created||'')+' · 수정 '+(n.updated||''));
    if(n.tags&&n.tags.length) L.push('- 태그: '+n.tags.map(function(t){return '#'+t}).join(' '));
    if(n.links&&n.links.length){ L.push('- 연결되는 글:');
      n.links.forEach(function(id){var q=PMAP[id]; if(q) L.push('    - ['+q.d+' '+q.t+']('+q.u+')')}) }
    L.push('');
    FIELDS.forEach(function(f){
      var v=(n[f.k]||'').trim(); if(!v) return;
      L.push('### '+f.label.replace(/\s*—.*$/,''),'');
      if(f.k==='quote') v=v.split('\n').map(function(x){return '> '+x}).join('\n');
      L.push(v,'');
    });
    L.push('---','');
  });
  return L.join('\n');
}
function fallbackDL(md,fn){
  try{ var b=new Blob([md],{type:'text/markdown;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fn;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},20000); toast('내려받았습니다');
  }catch(e){ toast('내보내기를 지원하지 않는 화면입니다') }
}

  var md=toMD(), fn='내생각_'+today()+'.md';
  if(dlNS){ dlNS.save({filename:fn,data:md}).then(function(){toast('저장했습니다')})
    .catch(function(e){ if(e&&e.code==='declined') return; fallbackDL(md,fn) }); return }
  fallbackDL(md,fn);
}

function resultsHTML(q,exclude){

      '<b>연결되는 글</b>을 걸어 두면 20년치 안에서 같은 이야기가 어떻게 반복되는지 보입니다.</div>'+

      '<button class="tbtn" id="changepost">글 바꾸기</button></div>') }
  else { h.push('<div class="pick"><input id="pickpost" type="text" autocomplete="off" '+

document.addEventListener('input',function(e){
  var t=e.target, n=noteById(cur);

  else if(t.id==='f_tags'){ if(n){n.tags=t.value.split(',').map(function(x){return x.trim()}).filter(Boolean);
    dirty=true; renderSaveBar()} }

    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800'+
    '&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">';
  return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n'+
    '<title>선배님의 20년 — 내 생각</title>\n'+fonts+'\n<style id="css">'+css+'<\/style>\n</head>\n<body>\n'+
    SHELL+'\n<div id="toast"><\/div>\n'+
    '<script type="application/json" id="cfg">'+cfg.replace(/</g,'\\u003c')+'<\/script>\n'+
    '<script type="application/json" id="posts">'+jsonSafe(POSTS)+'<\/script>\n'+
    '<script type="application/json" id="notes">'+jsonSafe(NOTES)+'<\/script>\n'+
    '<script type="text/plain" id="appsrc">'+app+'<\/script>\n'+
    '<script>'+app+'<\/script>\n</body>\n</html>\n';
}
function setBusy(b){var el=$('#savebtn'); if(el){el.disabled=b; el.textContent=b?'저장 중…':'저장'}}
function persist(){
  var n=noteById(cur); if(n) n.updated=today();
  if(artifactNS){
    stash(); setBusy(true);
    artifactNS.publish(buildDoc()).then(function(){}).catch(function(e){
      setBusy(false);
      var c=e&&e.code;
      if(c==='conflict'){ toast('다른 곳에서 먼저 저장되었습니다. 화면이 갱신됩니다.'); return }
      if(c==='not_writer'||c==='not_granted'||c==='not_declared'){
        localMode=true; artifactNS=null; saveLocal(); dirty=false; render();
        toast('읽기 전용 화면이라 이 브라우저에만 저장했습니다.'); return }
      if(c==='too_large'){ toast('내용이 너무 커서 저장하지 못했습니다.'); return }
      if(c==='rate_limited'){ toast('저장이 너무 잦습니다. 잠시 후 다시 눌러 주세요.'); return }
      toast('저장 실패: '+(e&&e.message||'알 수 없는 오류'));
    });
  } else { saveLocal(); dirty=false; renderSaveBar(); toast('이 브라우저에 저장했습니다'); }
}

function toMD(){
  var L=['# 내 생각 — 선배님 블로그 아카이브','','원문 760편(2006~2026) 기준. 내보낸 날짜: '+today(),'','---',''];
  NOTES.slice().sort(function(a,b){
    var da=PMAP[a.post]?PMAP[a.post].d:'0', db=PMAP[b.post]?PMAP[b.post].d:'0';
    return da<db?-1:da>db?1:0}).forEach(function(n){
    var p=PMAP[n.post];
    L.push('## '+(p?p.t:'(글 미지정)'),'');
    if(p) L.push('- 원문: ['+p.d+' · '+p.c+' · '+p.t+']('+p.u+')');
    L.push('- 상태: '+(n.status==='done'?'정리됨':'초안')+' · 작성 '+(n.created||'')+' · 수정 '+(n.updated||''));
    if(n.tags&&n.tags.length) L.push('- 태그: '+n.tags.map(function(t){return '#'+t}).join(' '));
    if(n.links&&n.links.length){ L.push('- 연결되는 글:');
      n.links.forEach(function(id){var q=PMAP[id]; if(q) L.push('    - ['+q.d+' '+q.t+']('+q.u+')')}) }
    L.push('');
    FIELDS.forEach(function(f){
      var v=(n[f.k]||'').trim(); if(!v) return;
      L.push('### '+f.label.replace(/\s*—.*$/,''),'');
      if(f.k==='quote') v=v.split('\n').map(function(x){return '> '+x}).join('\n');
      L.push(v,'');
    });
    L.push('---','');
  });
  return L.join('\n');
}
function fallbackDL(md,fn){
  try{ var b=new Blob([md],{type:'text/markdown;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fn;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},20000); toast('내려받았습니다');
  }catch(e){ toast('내보내기를 지원하지 않는 화면입니다') }
}
function exportMD(){
  var md=toMD(), fn='내생각_'+today()+'.md';
  if(dlNS){ dlNS.save({filename:fn,data:md}).then(function(){toast('저장했습니다')})
    .catch(function(e){ if(e&&e.code==='declined') return; fallbackDL(md,fn) }); return }
  fallbackDL(md,fn);
}
function newNote(){
  NOTES.unshift({id:uid(),post:'',quote:'',think:'',apply:'',differ:'',ask:'',links:[],tags:[],
    status:'draft',created:today(),updated:today()});
  cur=NOTES[0].id; dirty=true; render();
  setTimeout(function(){var el=$('#pickpost'); if(el) el.focus()},60);
}
function delNote(){
  if(!noteById(cur)) return;
  if(!confirm('이 노트를 지웁니다. 되돌릴 수 없습니다.')) return;
  NOTES=NOTES.filter(function(x){return x.id!==cur});
  cur=NOTES.length?sortedNotes()[0].id:null; dirty=true; render(); persist();
}
function sortedNotes(){
  return NOTES.slice().sort(function(a,b){
    var da=PMAP[a.post]?PMAP[a.post].d:'0', db=PMAP[b.post]?PMAP[b.post].d:'0';
    return da<db?1:da>db?-1:0});
}
function visibleNotes(){
  var q=filter.q.toLowerCase();
  return sortedNotes().filter(function(n){
    if(filter.st!=='all' && n.status!==filter.st) return false;
    if(!q) return true;
    var p=PMAP[n.post];
    var hay=[(p?p.t+' '+p.c+' '+p.d:''),n.quote,n.think,n.apply,n.differ,n.ask,(n.tags||[]).join(' ')].join(' ').toLowerCase();
    return hay.indexOf(q)>=0});
}

function renderBadge(){
  var b=$('#mode'); if(!b) return;
  if(!resolved){ b.textContent='연결 확인 중'; b.className='badge'; return }
  if(artifactNS){ b.textContent='저장됨 · 어디서나'; b.className='badge live' }
  else { b.textContent='이 브라우저에만 저장'; b.className='badge' }
}
function renderSaveBar(){ var el=$('#savestate'); if(el) el.textContent=dirty?'저장하지 않은 변경이 있습니다':'' }
function renderList(){
  var v=visibleNotes(), el=$('#nlist');
  if(!v.length){ el.innerHTML='<div class="empty">'+(NOTES.length?'조건에 맞는 노트가 없습니다.':
    '아직 노트가 없습니다.<br>위 <b>새 노트</b>로 시작하세요.')+'</div>'; return }
  el.innerHTML=v.map(function(n){
    var p=PMAP[n.post];
    var snip=(n.think||n.quote||'').replace(/\s+/g,' ').trim().slice(0,90);
    return '<button class="nitem'+(n.id===cur?' on':'')+'" data-id="'+n.id+'"><div class="nmeta">'+
      (p?'<span class="ndate">'+p.d+'</span><span class="ncat">'+esc(p.c.split(' > ').pop())+'</span>'
        :'<span class="ndate">미지정</span>')+
      '<span class="nst'+(n.status==='done'?' done':'')+'">'+(n.status==='done'?'정리됨':'초안')+'</span></div>'+
      '<div class="ntitle">'+esc(p?p.t:'(글을 고르세요)')+'</div>'+
      (snip?'<div class="nsnip">'+esc(snip)+'</div>':'')+'</button>'}).join('');
}
function resultsHTML(q,exclude){
  var s=q.trim().toLowerCase(); if(!s) return '';
  var hit=POSTS.filter(function(p){
    if(exclude&&exclude.indexOf(p.i)>=0) return false;
    return (p.t+' '+p.c+' '+p.d).toLowerCase().indexOf(s)>=0}).slice(0,40);
  if(!hit.length) return '<div class="empty" style="padding:18px">검색 결과가 없습니다.</div>';
  return hit.map(function(p){
    return '<button data-pick="'+p.i+'"><span class="rd">'+p.d+'</span> <span class="rc">'+
      esc(p.c.split(' > ').pop())+'</span><div class="rt">'+esc(p.t)+'</div></button>'}).join('');
}
function renderEditor(){
  var pane=$('#pane'), n=noteById(cur);
  if(!n){
    var done=NOTES.filter(function(x){return x.status==='done'}).length, cov={};
    NOTES.forEach(function(x){if(x.post) cov[x.post]=1});
    pane.innerHTML='<div class="wrap"><div class="stat">'+
      '<div><b class="tnum">'+NOTES.length+'</b><span>노트</span></div>'+
      '<div><b class="tnum">'+Object.keys(cov).length+'</b><span>다룬 글</span></div>'+
      '<div><b class="tnum">'+done+'</b><span>정리됨</span></div>'+
      '<div><b class="tnum">760</b><span>전체 글</span></div></div>'+
      '<div class="guide"><b>여기는 원문을 읽는 곳이 아니라, 원문에 내 답을 다는 곳입니다.</b><br>'+
      '글을 하나 고르고 다섯 칸을 채웁니다 — 인용 / 내 생각 / 나에게 적용하면 / 다른 점 / 남는 질문.<br>'+
      '그중 <b>‘다른 점’</b>이 이 노트의 핵심입니다. 그 칸이 비어 있으면 대개 아직 소화되지 않은 것입니다.<br>'+
      '<b>연결되는 글</b>을 걸어 두면 20년치 안에서 같은 이야기가 어떻게 반복되는지 보입니다.</div>'+
      '<div class="empty">왼쪽에서 노트를 고르거나 <b>새 노트</b>를 눌러 시작하세요.</div></div>';
    return }
  var p=PMAP[n.post], h=['<div class="wrap">'];
  h.push('<div class="src"><div class="lbl">대상 글</div>');
  if(p){ h.push('<h2>'+esc(p.t)+'</h2><div class="meta"><span class="chip cat">'+esc(p.c)+
      '</span><span class="chip mono">'+p.d+'</span></div><div class="acts">'+
      '<a class="tbtn" href="'+esc(p.u)+'" target="_blank" rel="noopener">네이버 원문 ↗</a>'+
      '<a class="tbtn" href="'+esc(CFG.dash)+'" target="_blank" rel="noopener">아카이브에서 보기 ↗</a>'+
      '<button class="tbtn" id="changepost">글 바꾸기</button></div>') }
  else { h.push('<div class="pick"><input id="pickpost" type="text" autocomplete="off" '+
      'placeholder="760편에서 글 찾기 — 제목·게시판·날짜"><div class="res" id="pickres" hidden></div></div>') }
  h.push('</div>');
  FIELDS.forEach(function(f){
    h.push('<div class="fld'+(f.cls?' '+f.cls:'')+'"><label for="f_'+f.k+'">'+f.label+'</label>'+
      '<div class="hint">'+f.hint+'</div><textarea id="f_'+f.k+'" data-k="'+f.k+'" rows="'+f.rows+
      '" placeholder="'+esc(f.ph)+'">'+esc(n[f.k]||'')+'</textarea></div>')});
  h.push('<div class="fld"><label>연결되는 글</label><div class="hint">'+
    '같은 이야기가 나오는 다른 글을 걸어 둡니다. 20년치 안에서 반복되는 지점을 찾는 장치입니다.</div>');
  (n.links||[]).forEach(function(id){var q=PMAP[id]; if(!q) return;
    h.push('<div class="linkrow"><span class="ld">'+q.d+'</span><span class="lt">'+esc(q.t)+'</span>'+
      '<a class="ld" href="'+esc(q.u)+'" target="_blank" rel="noopener">↗</a>'+
      '<button class="x" data-unlink="'+id+'" title="빼기">×</button></div>')});
  h.push('<div class="pick"><input id="picklink" type="text" autocomplete="off" placeholder="글 검색해서 추가">'+
    '<div class="res" id="linkres" hidden></div></div></div>');
  h.push('<div class="fld"><label for="f_tags">태그</label><div class="hint">'+
    '쉼표로 구분. 나중에 주제별로 모아 볼 때 씁니다.</div>'+
    '<input id="f_tags" type="text" placeholder="레버리지, 손절, 심리" value="'+esc((n.tags||[]).join(', '))+'">'+
    '<div class="tags">'+(n.tags||[]).map(function(t){return '<span class="tag">#'+esc(t)+'</span>'}).join('')+
    '</div></div>');
  h.push('<div class="savebar"><span class="st" id="savestate"></span>'+
    '<button class="tbtn" id="statusbtn">'+(n.status==='done'?'✓ 정리됨':'초안')+'</button>'+
    '<button class="tbtn" id="delbtn">삭제</button>'+
    '<button class="tbtn primary" id="savebtn">저장</button></div></div>');
  pane.innerHTML=h.join(''); renderSaveBar();
}
function render(){renderList();renderEditor();renderBadge()}

document.addEventListener('input',function(e){
  var t=e.target, n=noteById(cur);
  if(t.dataset&&t.dataset.k){ if(n){n[t.dataset.k]=t.value; dirty=true; renderSaveBar()} }
  else if(t.id==='f_tags'){ if(n){n.tags=t.value.split(',').map(function(x){return x.trim()}).filter(Boolean);
    dirty=true; renderSaveBar()} }
  else if(t.id==='nsearch'){ filter.q=t.value; renderList() }
  else if(t.id==='pickpost'){ var r=$('#pickres'); r.innerHTML=resultsHTML(t.value); r.hidden=!t.value.trim() }
  else if(t.id==='picklink'){ var r2=$('#linkres');
    r2.innerHTML=resultsHTML(t.value,((n&&n.links)||[]).concat(n&&n.post?[n.post]:[]));
    r2.hidden=!t.value.trim() }
});
document.addEventListener('click',function(e){
  var b, n;
  if(b=e.target.closest('.nitem')){ cur=b.dataset.id; render(); return }
  if(b=e.target.closest('[data-pick]')){ n=noteById(cur); if(!n) return;
    if(e.target.closest('#linkres')){ n.links=n.links||[];
      if(n.links.indexOf(b.dataset.pick)<0) n.links.push(b.dataset.pick) }
    else { n.post=b.dataset.pick }
    dirty=true; render(); return }
  if(b=e.target.closest('[data-unlink]')){ n=noteById(cur);
    if(n) n.links=(n.links||[]).filter(function(x){return x!==b.dataset.unlink});
    dirty=true; render(); return }
  if(e.target.closest('#changepost')){ n=noteById(cur); if(n){n.post=''; dirty=true; render()} return }
  if(e.target.closest('#newbtn')){ newNote(); return }
  if(e.target.closest('#savebtn')){ persist(); return }
  if(e.target.closest('#delbtn')){ delNote(); return }
  if(e.target.closest('#exportbtn')){ exportMD(); return }
  if(e.target.closest('#statusbtn')){ n=noteById(cur);
    if(n){n.status=n.status==='done'?'draft':'done'; dirty=true; render()} return }
  if(b=e.target.closest('.fbtn')){ filter.st=b.dataset.st;
    Array.prototype.forEach.call(document.querySelectorAll('.fbtn'),function(x){
      x.classList.toggle('on',x.dataset.st===filter.st)});
    renderList(); return }
  if(e.target.closest('#themebtn')){
    var c=document.documentElement.getAttribute('data-theme');
    var dk=window.matchMedia('(prefers-color-scheme:dark)').matches;
    var nx=c?(c==='dark'?'light':'dark'):(dk?'light':'dark');
    document.documentElement.setAttribute('data-theme',nx);
    try{localStorage.setItem('nb_theme',nx)}catch(err){} return }
  if(!e.target.closest('.pick')){
    var a=$('#pickres'), c2=$('#linkres'); if(a)a.hidden=true; if(c2)c2.hidden=true }
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault(); if(noteById(cur)) persist()}
});
window.addEventListener('beforeunload',function(e){ if(dirty){e.preventDefault(); e.returnValue=''} });

SHELL=$('#shell').outerHTML;
try{var th=localStorage.getItem('nb_theme'); if(th) document.documentElement.setAttribute('data-theme',th)}catch(e){}
try{var s=sessionStorage.getItem(SS); if(s){var d=JSON.parse(s); sessionStorage.removeItem(SS);
  if(d&&d.cur) cur=d.cur}}catch(e){}
if(!cur&&NOTES.length) cur=sortedNotes()[0].id;
render();
function goLocal(){
  localMode=true; resolved=true;
  var lv=null; try{lv=localStorage.getItem(LS)}catch(e){}
  if(lv){ try{ var arr=JSON.parse(lv);
    if(arr&&arr.length){ NOTES=arr; if(!noteById(cur)) cur=NOTES.length?sortedNotes()[0].id:null } }catch(e){} }
  render();
}
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(a){
    artifactNS=a; resolved=true;
    if(!a) goLocal(); else renderBadge();
  }).catch(function(){goLocal()});
  window.claude.use('downloads').then(function(d){dlNS=d}).catch(function(){});
  setTimeout(function(){ if(!resolved) goLocal() },11000);
} else { goLocal() }
})();
</script>
</body>
</html>
