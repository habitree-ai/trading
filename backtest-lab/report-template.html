<title>월 10% 프런티어</title>
<style>
  /* 다크 기본 — 백테스트 시리즈 공통 토큰에 dataviz 검증 팔레트를 얹었다. */
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --surface: #161a21;
    --surface-2: #1e232c;
    --border: #2a3039;
    --ink: #e6e9ee;
    --dim: #8b95a3;
    --muted: #898781;
    --grid: #232935;
    --s1: #3987e5;   /* 검증: dark, surface #161a21 */
    --s2: #d95926;
    --s3: #199e70;
    --pos: #3987e5;
    --neg: #e66767;
    --good: #0ca30c;
    --warn: #fab219;
    --crit: #d03b3b;
    --accent-soft: rgba(57, 135, 229, 0.14);
  }
  /* 라이트는 두 곳에 같은 값을 둔다 — OS 설정(미디어)과 뷰어의 명시 선택(스탬프).
     미디어만 두면 "OS 다크 + 뷰어가 라이트 선택"에서 라이트가 지고 만다. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-2: #f1f3f6;
      --border: #e2e5ea;
      --ink: #14171c;
      --dim: #666e7a;
      --muted: #898781;
      --grid: #e8eaee;
      --s1: #2a78d6;
      --s2: #eb6834;
      --s3: #1baf7a;
      --pos: #2a78d6;
      --neg: #e34948;
      --good: #0ca30c;
      --warn: #b57a00;
      --crit: #d03b3b;
      --accent-soft: rgba(42, 120, 214, 0.1);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e2e5ea;
    --ink: #14171c;
    --dim: #666e7a;
    --muted: #898781;
    --grid: #e8eaee;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --pos: #2a78d6;
    --neg: #e34948;
    --good: #0ca30c;
    --warn: #b57a00;
    --crit: #d03b3b;
    --accent-soft: rgba(42, 120, 214, 0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 22px 96px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 10px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; margin: 52px 0 6px; letter-spacing: -0.01em; }
  h2 .num { color: var(--dim); font-weight: 500; margin-right: 8px; }
  h3 { font-size: 15.5px; margin: 30px 0 8px; }
  p { margin: 10px 0; }
  .lede { color: var(--dim); font-size: 16px; margin-bottom: 22px; }
  .note { color: var(--dim); font-size: 13px; }
  code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 13px;
         font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  a { color: var(--s1); }

  .verdict {
    border: 1px solid var(--border); border-left: 3px solid var(--crit);
    background: var(--surface); border-radius: 10px; padding: 18px 20px; margin: 22px 0 8px;
  }
  .verdict .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    color: var(--crit); border: 1px solid var(--crit); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
  .verdict p { margin: 6px 0; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 20px 0 6px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--dim); letter-spacing: .02em; }
  .tile .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .tile.bad .v { color: var(--crit); }
  .tile.ok .v { color: var(--good); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin: 16px 0; }
  .card > h3:first-child { margin-top: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 12px 0; }
  th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th.l, td.l { text-align: left; }
  thead th { color: var(--dim); font-weight: 600; font-size: 12.5px; white-space: nowrap;
             border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
  tbody tr:hover { background: var(--accent-soft); }
  .scroll { overflow-x: auto; margin: 12px -4px; padding: 0 4px; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .pass { color: var(--good); font-weight: 650; }
  .fail { color: var(--crit); font-weight: 650; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
          border: 1px solid var(--border); color: var(--dim); margin-left: 5px; }
  .chip.new { color: var(--s2); border-color: var(--s2); }

  figure { margin: 18px 0 8px; }
  figcaption { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .figtitle { font-size: 14.5px; font-weight: 620; margin-bottom: 2px; }
  .figsub { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }
  /* overflow는 자르는 쪽이 안전하다 — 회전 라벨이 새어나가면 본문에 가로 스크롤이 생긴다. */
  svg { display: block; max-width: 100%; height: auto; }
  .chartbox { overflow-x: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--dim); margin: 4px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .tt { position: fixed; pointer-events: none; background: var(--surface-2); color: var(--ink);
        border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 12.5px;
        line-height: 1.5; box-shadow: 0 6px 18px rgba(0,0,0,.28); opacity: 0; transition: opacity .1s; z-index: 50;
        font-variant-numeric: tabular-nums; max-width: 280px; }
  .tt.on { opacity: 1; }

  ul, ol { margin: 10px 0; padding-left: 20px; }
  li { margin: 5px 0; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 40px 0; }
  .kicker { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  details { margin: 10px 0; }
  summary { cursor: pointer; color: var(--dim); font-size: 13.5px; }
</style>

<div class="wrap" id="app"></div>
<div class="tt" id="tt"></div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const app = document.getElementById("app");
const tt = document.getElementById("tt");

/* ---------- 유틸 ---------- */
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const n2 = (v) => (v === null || v === undefined || Number.isNaN(v) ? "—" : Number(v).toFixed(2));
const n1 = (v) => (v === null || v === undefined ? "—" : Number(v).toFixed(1));
const sgn = (v, d = 2) => {
  if (v === null || v === undefined) return "—";
  const s = Number(v).toFixed(d);
  return `<span class="${v > 0 ? "pass" : v < 0 ? "fail" : ""}">${v > 0 ? "+" : ""}${s}</span>`;
};
const yn = (b) => (b ? '<span class="pass">통과</span>' : '<span class="fail">미달</span>');
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; };
/** 문자열이든 이미 만들어진 노드든 받는다 — 차트는 노드로, 본문은 문자열로 온다. */
const add = (x) => app.appendChild(typeof x === "string" ? h(x) : x);

function showTip(e, html) {
  tt.innerHTML = html; tt.classList.add("on");
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tt.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tt.style.left = x + "px"; tt.style.top = y + "px";
}
const hideTip = () => tt.classList.remove("on");

/** SVG 헬퍼 — viewBox 좌표계로 그리고 CSS가 폭을 맞춘다. */
function svgEl(w, h) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.setAttribute("width", "100%");
  s.setAttribute("role", "img");
  return s;
}
function el(tag, attrs, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function figure(titleText, subText, node, caption) {
  const f = document.createElement("figure");
  f.innerHTML = `<div class="figtitle">${titleText}</div><div class="figsub">${subText}</div>`;
  const box = document.createElement("div");
  box.className = "chartbox";
  box.appendChild(node);
  f.appendChild(box);
  if (caption) { const c = document.createElement("figcaption"); c.innerHTML = caption; f.appendChild(c); }
  return f;
}
function legend(items) {
  const d = document.createElement("div");
  d.className = "legend";
  d.innerHTML = items.map((i) => `<span><i style="background:${i.c}"></i>${esc(i.t)}</span>`).join("");
  return d;
}
const CSS = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- 차트 ---------- */

/** 히스토그램 + 세로 기준선. 단일 계열이라 범례 없음(제목이 계열을 말한다). */
function histChart(bins, marks) {
  const W = 1000, H = 300, L = 52, R = 16, T = 14, B = 44;
  const s = svgEl(W, H);
  const iw = W - L - R, ih = H - T - B;
  const maxC = Math.max(...bins.map((b) => b.count));
  const step = bins[1].lo - bins[0].lo;
  // 도메인은 막대와 기준선을 모두 담는다 — 기준선이 축 밖에 있으면 비교가 안 된다.
  const d0 = Math.min(bins[0].lo, ...marks.map((m) => m.v)) - step;
  const d1 = Math.max(bins[bins.length - 1].lo + step, ...marks.map((m) => m.v)) + step;
  const xs = (v) => L + ((v - d0) / (d1 - d0)) * iw;
  const bw = (step / (d1 - d0)) * iw;
  const ys = (c) => T + ih - (c / maxC) * ih;

  for (let g = 0; g <= 4; g++) {
    const y = T + (ih * g) / 4;
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: L - 8, y: y + 4, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = Math.round((maxC * (4 - g)) / 4);
  }
  bins.forEach((b, i) => {
    const x = xs(b.lo), hh = T + ih - ys(b.count);
    if (b.count > 0) {
      const r = el("rect", { x: x + 1, y: ys(b.count), width: Math.max(1, bw - 2), height: Math.max(1, hh), rx: 2,
        fill: b.lo >= 0 ? CSS("--s1") : CSS("--muted"), opacity: b.lo >= 0 ? 0.95 : 0.55 }, s);
      r.style.cursor = "crosshair";
      r.addEventListener("mousemove", (e) => showTip(e, `t ∈ [${b.lo}, ${(b.lo + step).toFixed(1)})<br><b>${b.count}</b>개 조합`));
      r.addEventListener("mouseleave", hideTip);
    }
    if (i % 4 === 0) el("text", { x: x + bw / 2, y: H - B + 16, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = b.lo.toFixed(0);
  });
  // 기준선 라벨은 세로로 층을 나눈다 — 오른쪽 끝에서 두 선이 가까워 가로로는 반드시 겹친다.
  marks.forEach((m, i) => {
    const x = xs(m.v);
    el("line", { x1: x, x2: x, y1: T - 4, y2: T + ih, stroke: m.c, "stroke-width": 2, "stroke-dasharray": m.dash || "5 4" }, s);
    if (!m.label) return;
    const y = T + 12 + i * 19;
    el("text", { x: x - 8, y, "text-anchor": "end", fill: m.c, "font-size": 12, "font-weight": 640 }, s).textContent = m.label;
  });
  el("line", { x1: L, x2: W - R, y1: T + ih, y2: T + ih, stroke: CSS("--border"), "stroke-width": 1 }, s);
  el("text", { x: L + iw / 2, y: H - 6, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11.5 }, s)
    .textContent = "t-통계량 (조합별 기대값의 유의성)";
  return s;
}

/** 그룹 막대 — 계열 2개, 2px 간격. */
function groupedBars(groups, series, opts = {}) {
  const W = 1000, H = opts.height || 300, L = 56, R = 18, T = 16, B = 52;
  const s = svgEl(W, H);
  const iw = W - L - R, ih = H - T - B;
  const all = groups.flatMap((g) => series.map((se) => g[se.k])).filter((v) => v !== null);
  const maxV = opts.max ?? Math.max(...all, 0) * 1.12;
  const minV = Math.min(0, ...all) * 1.12;
  const ys = (v) => T + ih - ((v - minV) / (maxV - minV)) * ih;
  const gw = iw / groups.length, bw = Math.min(64, (gw - 18) / series.length);

  for (let g = 0; g <= 4; g++) {
    const v = minV + ((maxV - minV) * g) / 4, y = ys(v);
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: L - 8, y: y + 4, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s).textContent = v.toFixed(opts.dec ?? 1);
  }
  if (opts.ref !== undefined) {
    const y = ys(opts.ref);
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: CSS("--warn"), "stroke-width": 2, "stroke-dasharray": "6 4" }, s);
    el("text", { x: W - R, y: y - 7, "text-anchor": "end", fill: CSS("--warn"), "font-size": 12, "font-weight": 640 }, s)
      .textContent = opts.refLabel;
  }
  groups.forEach((g, gi) => {
    series.forEach((se, si) => {
      const v = g[se.k];
      if (v === null || v === undefined) return;
      const x = L + gi * gw + (gw - bw * series.length - 2 * (series.length - 1)) / 2 + si * (bw + 2);
      const y = Math.min(ys(v), ys(0)), hh = Math.abs(ys(v) - ys(0));
      const r = el("rect", { x, y, width: bw, height: Math.max(1.5, hh), rx: 4, fill: se.c }, s);
      r.style.cursor = "crosshair";
      r.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(g.label)}</b><br>${esc(se.t)}: <b>${v}</b>${opts.unit || ""}`));
      r.addEventListener("mouseleave", hideTip);
      if (opts.labelBars) el("text", { x: x + bw / 2, y: v >= 0 ? y - 5 : y + hh + 13, "text-anchor": "middle",
        fill: CSS("--dim"), "font-size": 11.5 }, s).textContent = v;
    });
    el("text", { x: L + gi * gw + gw / 2, y: H - B + 18, "text-anchor": "middle", fill: CSS("--dim"), "font-size": 12 }, s)
      .textContent = g.label;
    if (g.sub) el("text", { x: L + gi * gw + gw / 2, y: H - B + 33, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = g.sub;
  });
  el("line", { x1: L, x2: W - R, y1: ys(0), y2: ys(0), stroke: CSS("--border"), "stroke-width": 1.5 }, s);
  if (opts.yLabel) el("text", { x: 14, y: T + ih / 2, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11.5,
    transform: `rotate(-90 14 ${T + ih / 2})` }, s).textContent = opts.yLabel;
  return s;
}

/** 수평 막대 쌍 — IS vs OOS 같은 대비. */
function pairedHBars(items, series) {
  const W = 1000, rowH = 40, L = 300, R = 60, T = 14;
  const H = T + items.length * rowH + 34;
  const s = svgEl(W, H);
  const iw = W - L - R;
  const vals = items.flatMap((i) => series.map((se) => i[se.k])).filter((v) => v !== null);
  const maxA = Math.max(...vals.map(Math.abs)) * 1.15;
  const xs = (v) => L + iw / 2 + (v / maxA) * (iw / 2);

  el("line", { x1: xs(0), x2: xs(0), y1: T, y2: T + items.length * rowH, stroke: CSS("--border"), "stroke-width": 1.5 }, s);
  [-maxA / 2, maxA / 2].forEach((v) => {
    el("line", { x1: xs(v), x2: xs(v), y1: T, y2: T + items.length * rowH, stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: xs(v), y: H - 12, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s).textContent = v.toFixed(2);
  });
  el("text", { x: xs(0), y: H - 12, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s).textContent = "0";

  items.forEach((it, i) => {
    const y0 = T + i * rowH;
    el("text", { x: L - 12, y: y0 + rowH / 2 + 4, "text-anchor": "end", fill: CSS("--ink"), "font-size": 12.5 }, s).textContent = it.label;
    series.forEach((se, si) => {
      const v = it[se.k];
      if (v === null) return;
      const bh = 12, y = y0 + 6 + si * (bh + 2);
      const x = v >= 0 ? xs(0) : xs(v);
      const w = Math.max(1.5, Math.abs(xs(v) - xs(0)));
      const r = el("rect", { x, y, width: w, height: bh, rx: 3, fill: se.c }, s);
      r.style.cursor = "crosshair";
      r.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(it.label)}</b><br>${esc(se.t)}: <b>${v > 0 ? "+" : ""}${v}%</b>${it.sub ? "<br>" + esc(it.sub) : ""}`));
      r.addEventListener("mouseleave", hideTip);
      el("text", { x: v >= 0 ? x + w + 6 : x - 6, y: y + bh - 2, "text-anchor": v >= 0 ? "start" : "end",
        fill: CSS("--muted"), "font-size": 10.5 }, s).textContent = (v > 0 ? "+" : "") + v;
    });
  });
  return s;
}

/** 자산곡선 — 로그 축(자산이 13배 갔다가 1/24로 온다). */
function equityCurve(points, opts = {}) {
  const W = 1000, H = 320, L = 58, R = 20, T = 18, B = 40;
  const s = svgEl(W, H);
  const iw = W - L - R, ih = H - T - B;
  const t0 = points[0].t, t1 = points[points.length - 1].t;
  const eqs = points.map((p) => Math.max(p.equity, 1));
  const lo = Math.min(...eqs) * 0.8, hi = Math.max(...eqs) * 1.2;
  const xs = (t) => L + ((t - t0) / (t1 - t0)) * iw;
  const ys = (v) => T + ih - ((Math.log(Math.max(v, 1)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * ih;

  [1, 10, 100, 1000].filter((v) => v >= lo * 0.5 && v <= hi).forEach((v) => {
    el("line", { x1: L, x2: W - R, y1: ys(v), y2: ys(v), stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: L - 8, y: ys(v) + 4, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s).textContent = "$" + v;
  });
  el("line", { x1: L, x2: W - R, y1: ys(100), y2: ys(100), stroke: CSS("--warn"), "stroke-width": 1.5, "stroke-dasharray": "5 4" }, s);
  el("text", { x: W - R, y: ys(100) - 6, "text-anchor": "end", fill: CSS("--warn"), "font-size": 11.5 }, s).textContent = "시작 $100";

  const d = points.map((p, i) => `${i ? "L" : "M"}${xs(p.t).toFixed(1)},${ys(p.equity).toFixed(1)}`).join(" ");
  el("path", { d, fill: "none", stroke: CSS("--s1"), "stroke-width": 2, "stroke-linejoin": "round" }, s);

  const peak = points.reduce((a, b) => (b.equity > a.equity ? b : a));
  const trough = points.slice(points.indexOf(peak)).reduce((a, b) => (b.equity < a.equity ? b : a), peak);
  [[peak, "고점 $" + peak.equity.toFixed(0), CSS("--good")], [trough, "저점 $" + trough.equity.toFixed(0), CSS("--crit")]]
    .forEach(([p, lab, c]) => {
      el("circle", { cx: xs(p.t), cy: ys(p.equity), r: 5, fill: c, stroke: CSS("--surface"), "stroke-width": 2 }, s);
      el("text", { x: xs(p.t), y: ys(p.equity) - 12, "text-anchor": "middle", fill: c, "font-size": 12, "font-weight": 640 }, s).textContent = lab;
    });

  const ticks = 6;
  for (let i = 0; i <= ticks; i++) {
    const t = t0 + ((t1 - t0) * i) / ticks;
    el("text", { x: xs(t), y: H - 14, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = new Date(t).toISOString().slice(2, 7);
  }
  const hit = el("rect", { x: L, y: T, width: iw, height: ih, fill: "transparent" }, s);
  hit.style.cursor = "crosshair";
  const cross = el("line", { x1: L, x2: L, y1: T, y2: T + ih, stroke: CSS("--dim"), "stroke-width": 1, opacity: 0 }, s);
  hit.addEventListener("mousemove", (e) => {
    const box = s.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const t = t0 + ((px - L) / iw) * (t1 - t0);
    let best = points[0];
    for (const p of points) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
    cross.setAttribute("x1", xs(best.t)); cross.setAttribute("x2", xs(best.t)); cross.setAttribute("opacity", 1);
    showTip(e, `${new Date(best.t).toISOString().slice(0, 10)}<br>자산 <b>$${best.equity.toFixed(2)}</b>`);
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
  return s;
}

/** 월별 수익률 — 발산 색(양/음) + 목표선. */
function monthlyBars(months, target) {
  const W = 1000, H = 292, L = 52, R = 16, T = 18, B = 64;
  const s = svgEl(W, H);
  const iw = W - L - R, ih = H - T - B;
  const vals = months.map((m) => m.ret);
  const hi = Math.max(...vals, target) * 1.1, lo = Math.min(...vals, 0) * 1.1;
  const ys = (v) => T + ih - ((v - lo) / (hi - lo)) * ih;
  const bw = iw / months.length;

  for (let g = 0; g <= 4; g++) {
    const v = lo + ((hi - lo) * g) / 4, y = ys(v);
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: L - 8, y: y + 4, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s).textContent = v.toFixed(0) + "%";
  }
  el("line", { x1: L, x2: W - R, y1: ys(target), y2: ys(target), stroke: CSS("--warn"), "stroke-width": 2, "stroke-dasharray": "6 4" }, s);
  el("text", { x: W - R, y: ys(target) - 6, "text-anchor": "end", fill: CSS("--warn"), "font-size": 12, "font-weight": 640 }, s)
    .textContent = `목표 +${target}%`;

  months.forEach((m, i) => {
    const x = L + i * bw + 1.5, w = Math.max(1.5, bw - 3);
    const y = Math.min(ys(m.ret), ys(0)), hh = Math.abs(ys(m.ret) - ys(0));
    const r = el("rect", { x, y, width: w, height: Math.max(1.5, hh), rx: 3, fill: m.ret >= 0 ? CSS("--pos") : CSS("--neg") }, s);
    r.style.cursor = "crosshair";
    r.addEventListener("mousemove", (e) => showTip(e, `<b>${m.month}</b><br>수익률 <b>${m.ret > 0 ? "+" : ""}${m.ret}%</b><br>월말 자산 $${m.equity}`));
    r.addEventListener("mouseleave", hideTip);
    // 라벨은 오른쪽 아래가 아니라 왼쪽 아래로 눕힌다 — 오른쪽으로 눕히면 마지막 라벨이 뷰박스를 넘는다.
    if (i % 3 === 0) el("text", { x: x + w / 2, y: H - B + 16, "text-anchor": "end", fill: CSS("--muted"), "font-size": 10,
      transform: `rotate(-45 ${x + w / 2} ${H - B + 16})` }, s).textContent = m.month.slice(2);
  });
  el("line", { x1: L, x2: W - R, y1: ys(0), y2: ys(0), stroke: CSS("--border"), "stroke-width": 1.5 }, s);
  return s;
}

/** 프런티어 산점도 — x: 보수 MDD, y: 월 중앙 수익률. 계열 2(바스켓). */
function frontierScatter(sets) {
  const W = 1000, H = 380, L = 60, R = 24, T = 20, B = 52;
  const s = svgEl(W, H);
  const iw = W - L - R, ih = H - T - B;
  const pts = sets.flatMap((se) => se.pts);
  const xMin = Math.min(-100, ...pts.map((p) => p.x)), xMax = 0;
  // 판정이 일어나는 구간에 축을 맞춘다. 아래로 크게 벗어난 설정은 바닥에 눌러 표시하고
  // 개수를 캡션에 적는다 — 이상치에 축을 내주면 정작 봐야 할 곳이 안 보인다.
  const Y_FLOOR = -20;
  const yMin = Y_FLOOR, yMax = Math.max(14, ...pts.map((p) => p.y)) * 1.05;
  const clamped = pts.filter((p) => p.y < Y_FLOOR).length;
  const xs = (v) => L + ((v - xMin) / (xMax - xMin)) * iw;
  const ys = (v) => T + ih - ((v - yMin) / (yMax - yMin)) * ih;

  for (let g = 0; g <= 4; g++) {
    const v = yMin + ((yMax - yMin) * g) / 4, y = ys(v);
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: L - 8, y: y + 4, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s).textContent = v.toFixed(0) + "%";
  }
  for (let g = 0; g <= 4; g++) {
    const v = xMin + ((xMax - xMin) * g) / 4;
    el("text", { x: xs(v), y: H - B + 18, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s).textContent = v.toFixed(0) + "%";
  }
  // 합격 영역 — 월 ≥10% 이면서 MDD ≥ −50%
  el("rect", { x: xs(-50), y: ys(yMax), width: xs(0) - xs(-50), height: ys(10) - ys(yMax),
    fill: CSS("--good"), opacity: 0.09 }, s);
  el("line", { x1: L, x2: W - R, y1: ys(10), y2: ys(10), stroke: CSS("--warn"), "stroke-width": 2, "stroke-dasharray": "6 4" }, s);
  el("text", { x: L + 6, y: ys(10) - 9, fill: CSS("--warn"), "font-size": 12, "font-weight": 640 }, s).textContent = "C1 월 중앙 +10%";
  el("line", { x1: xs(-50), x2: xs(-50), y1: T, y2: T + ih, stroke: CSS("--warn"), "stroke-width": 2, "stroke-dasharray": "6 4" }, s);
  el("text", { x: xs(-50) + 8, y: T + 32, fill: CSS("--warn"), "font-size": 12, "font-weight": 640 }, s).textContent = "C3 MDD −50%";
  el("text", { x: xs(-50) + (xs(0) - xs(-50)) / 2, y: ys(10) - 12, "text-anchor": "middle", fill: CSS("--good"),
    "font-size": 13, "font-weight": 650 }, s).textContent = "합격 영역 — 점 0개";

  sets.forEach((se) => se.pts.forEach((p) => {
    const low = p.y < Y_FLOOR;
    const c = el("circle", { cx: xs(Math.max(p.x, xMin)), cy: ys(low ? Y_FLOOR : p.y), r: low ? 3.5 : 5,
      fill: low ? "none" : se.c, stroke: se.c, "stroke-width": low ? 1.5 : 2, opacity: low ? 0.6 : 0.82 }, s);
    if (!low) c.setAttribute("stroke", CSS("--surface"));
    c.style.cursor = "crosshair";
    c.addEventListener("mousemove", (e) => showTip(e, `<b>바스켓 ${p.basket}</b> · ${p.overlay} · cap${p.cap} · 리스크 ${p.risk}%<br>월 중앙 <b>${p.y}%</b>${low ? " <i>(축 아래 — 눌러 표시)</i>" : ""} · 보수 MDD <b>${p.x}%</b><br>최종 $${p.eq} · CAGR ${p.cagr}% · 파산확률 ${p.ruin}%`));
    c.addEventListener("mouseleave", hideTip);
  }));
  s.dataset.clamped = String(clamped); // 캡션이 읽는다 — SVG 안에 두면 축 라벨과 겹친다.
  el("line", { x1: L, x2: W - R, y1: ys(0), y2: ys(0), stroke: CSS("--border"), "stroke-width": 1.5 }, s);
  el("text", { x: L + iw / 2, y: H - 10, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11.5 }, s)
    .textContent = "보수 최대낙폭 (%) — 오른쪽일수록 안전";
  el("text", { x: 16, y: T + ih / 2, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11.5,
    transform: `rotate(-90 16 ${T + ih / 2})` }, s).textContent = "월 수익률 중앙값 (%)";
  return s;
}

/* ---------- 표 ---------- */
function table(cols, rows, opts = {}) {
  const thead = `<thead><tr>${cols.map((c) => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead>`;
  const tbody = `<tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.l ? "l" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody>`;
  return `<div class="scroll"><table>${thead}${tbody}</table></div>` + (opts.note ? `<p class="note">${opts.note}</p>` : "");
}
