<title>달성 가능한 최대 월 복리</title>
<style>
  /* 앞 회차 리포트와 같은 토큰 — 형제 문서다. 계열색은 dataviz 검증 팔레트. */
  :root {
    color-scheme: dark;
    --bg: #0e1116; --surface: #161a21; --surface-2: #1e232c; --border: #2a3039;
    --ink: #e6e9ee; --dim: #8b95a3; --muted: #898781; --grid: #232935;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --pos: #3987e5; --neg: #e66767;
    --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
    --accent-soft: rgba(57, 135, 229, 0.14);
  }
  /* 라이트는 두 곳에 — OS 설정(미디어)과 뷰어의 명시 선택(스탬프). */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
      --ink: #14171c; --dim: #666e7a; --muted: #898781; --grid: #e8eaee;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
      --pos: #2a78d6; --neg: #e34948;
      --good: #0ca30c; --warn: #b57a00; --crit: #d03b3b;
      --accent-soft: rgba(42, 120, 214, 0.1);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
    --ink: #14171c; --dim: #666e7a; --muted: #898781; --grid: #e8eaee;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --pos: #2a78d6; --neg: #e34948;
    --good: #0ca30c; --warn: #b57a00; --crit: #d03b3b;
    --accent-soft: rgba(42, 120, 214, 0.1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 22px 96px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 10px; letter-spacing: -0.02em; text-wrap: balance; }
  h2 { font-size: 20px; margin: 52px 0 6px; letter-spacing: -0.01em; }
  h2 .num { color: var(--dim); font-weight: 500; margin-right: 8px; }
  h3 { font-size: 15.5px; margin: 30px 0 8px; }
  p { margin: 10px 0; }
  .lede { color: var(--dim); font-size: 16px; margin-bottom: 22px; }
  .note { color: var(--dim); font-size: 13px; }
  code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 13px;
         font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  a { color: var(--s1); }

  .verdict { border: 1px solid var(--border); border-left: 3px solid var(--warn);
    background: var(--surface); border-radius: 10px; padding: 18px 20px; margin: 22px 0 8px; }
  .verdict .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
  .verdict p { margin: 6px 0; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 20px 0 6px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--dim); }
  .tile .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .tile.bad .v { color: var(--crit); }
  .tile.ok .v { color: var(--good); }
  .tile.hi { border-color: var(--warn); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin: 16px 0; }
  .card > h3:first-child { margin-top: 0; }
  .card.pick { border-left: 3px solid var(--good); }
  .card.avoid { border-left: 3px solid var(--crit); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 12px 0; }
  th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th.l, td.l { text-align: left; }
  thead th { color: var(--dim); font-weight: 600; font-size: 12.5px; white-space: nowrap; background: var(--surface); }
  tbody tr:hover { background: var(--accent-soft); }
  .scroll { overflow-x: auto; margin: 12px -4px; padding: 0 4px; }
  .chartbox { overflow-x: auto; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .pass { color: var(--good); font-weight: 650; } .fail { color: var(--crit); font-weight: 650; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
          border: 1px solid var(--border); color: var(--dim); margin-left: 5px; }
  .chip.new { color: var(--s2); border-color: var(--s2); }
  .chip.warnc { color: var(--warn); border-color: var(--warn); }

  figure { margin: 18px 0 8px; }
  figcaption { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .figtitle { font-size: 14.5px; font-weight: 620; margin-bottom: 2px; }
  .figsub { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }
  svg { display: block; max-width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--dim); margin: 4px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .tt { position: fixed; pointer-events: none; background: var(--surface-2); color: var(--ink);
        border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; line-height: 1.5;
        box-shadow: 0 6px 18px rgba(0,0,0,.28); opacity: 0; transition: opacity .1s; z-index: 50;
        font-variant-numeric: tabular-nums; max-width: 300px; }
  .tt.on { opacity: 1; }
  ul, ol { margin: 10px 0; padding-left: 20px; }
  li { margin: 5px 0; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 40px 0; }
  .kicker { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
</style>

<div class="wrap" id="app"></div>
<div class="tt" id="tt"></div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const app = document.getElementById("app");
const tt = document.getElementById("tt");

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const n2 = (v) => (v === null || v === undefined || Number.isNaN(v) ? "—" : Number(v).toFixed(2));
const n1 = (v) => (v === null || v === undefined ? "—" : Number(v).toFixed(1));
const sgn = (v, d = 2) => v === null || v === undefined ? "—"
  : `<span class="${v > 0 ? "pass" : v < 0 ? "fail" : ""}">${v > 0 ? "+" : ""}${Number(v).toFixed(d)}</span>`;
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; };
const add = (x) => app.appendChild(typeof x === "string" ? h(x) : x);
const CSS = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const d10 = (t) => new Date(t).toISOString().slice(0, 10);

function showTip(e, html) {
  tt.innerHTML = html; tt.classList.add("on");
  const pad = 14; let x = e.clientX + pad, y = e.clientY + pad;
  const r = tt.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tt.style.left = x + "px"; tt.style.top = y + "px";
}
const hideTip = () => tt.classList.remove("on");

function svgEl(w, hh) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${hh}`); s.setAttribute("width", "100%"); s.setAttribute("role", "img");
  return s;
}
function el(tag, attrs, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function figure(t, sub, node, cap) {
  const f = document.createElement("figure");
  f.innerHTML = `<div class="figtitle">${t}</div><div class="figsub">${sub}</div>`;
  const box = document.createElement("div"); box.className = "chartbox"; box.appendChild(node); f.appendChild(box);
  if (cap) { const c = document.createElement("figcaption"); c.innerHTML = cap; f.appendChild(c); }
  return f;
}
function legend(items) {
  const d = document.createElement("div"); d.className = "legend";
  d.innerHTML = items.map((i) => `<span><i style="background:${i.c}"></i>${esc(i.t)}</span>`).join("");
  return d;
}
function table(cols, rows, note) {
  const thead = `<thead><tr>${cols.map((c) => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead>`;
  const tbody = `<tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.l ? "l" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody>`;
  return `<div class="scroll"><table>${thead}${tbody}</table></div>` + (note ? `<p class="note">${note}</p>` : "");
}

/* ---------- 차트 ---------- */

/** 세로 막대 — 0 기준 발산. 단일 계열이라 범례 없음. */
function barsAroundZero(items, opts = {}) {
  const W = 1000, H = opts.height || 300, L = 62, R = 20, T = 20, B = opts.bottom || 60;
  const s = svgEl(W, H);
  const iw = W - L - R, ih = H - T - B;
  const vals = items.map((i) => i.v);
  const hi = Math.max(0, ...vals, opts.ref ?? -Infinity) * 1.15;
  const lo = Math.min(0, ...vals) * 1.15;
  const ys = (v) => T + ih - ((v - lo) / (hi - lo)) * ih;
  const gw = iw / items.length, bw = Math.min(96, gw - 26);

  for (let g = 0; g <= 4; g++) {
    const v = lo + ((hi - lo) * g) / 4, y = ys(v);
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: L - 8, y: y + 4, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = v.toFixed(opts.dec ?? 2) + (opts.unit || "");
  }
  if (opts.ref !== undefined) {
    const y = ys(opts.ref);
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: CSS("--warn"), "stroke-width": 2, "stroke-dasharray": "6 4" }, s);
    el("text", { x: W - R, y: y - 7, "text-anchor": "end", fill: CSS("--warn"), "font-size": 12, "font-weight": 640 }, s)
      .textContent = opts.refLabel;
  }
  items.forEach((it, i) => {
    const x = L + i * gw + (gw - bw) / 2;
    const y = Math.min(ys(it.v), ys(0)), hh = Math.abs(ys(it.v) - ys(0));
    const c = it.c || (it.v >= 0 ? CSS("--pos") : CSS("--neg"));
    const r = el("rect", { x, y, width: bw, height: Math.max(2, hh), rx: 4, fill: c }, s);
    r.style.cursor = "crosshair";
    r.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(it.label)}</b><br>${esc(opts.metric || "값")}: <b>${it.v > 0 ? "+" : ""}${it.v}${opts.unit || ""}</b>${it.tip ? "<br>" + it.tip : ""}`));
    r.addEventListener("mouseleave", hideTip);
    el("text", { x: x + bw / 2, y: it.v >= 0 ? y - 7 : y + hh + 15, "text-anchor": "middle",
      fill: CSS("--ink"), "font-size": 12.5, "font-weight": 620 }, s).textContent = (it.v > 0 ? "+" : "") + it.v + (opts.unit || "");
    el("text", { x: L + i * gw + gw / 2, y: H - B + 20, "text-anchor": "middle", fill: CSS("--dim"), "font-size": 12 }, s)
      .textContent = it.label;
    if (it.sub) el("text", { x: L + i * gw + gw / 2, y: H - B + 36, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = it.sub;
  });
  el("line", { x1: L, x2: W - R, y1: ys(0), y2: ys(0), stroke: CSS("--border"), "stroke-width": 1.5 }, s);
  return s;
}

/** 수평 발산 막대 — 지표 랭킹용. 라벨이 길어 가로가 맞다. */
function hBars(items) {
  // 값은 막대 끝이 아니라 오른쪽 고정 열에 둔다. 막대 끝에 붙이면 긴 막대에서
  // 지표명과 겹친다(누적 −94%짜리가 실제로 그랬다).
  const W = 1000, rowH = 26, L = 232, R = 132, T = 16, VALX = 998;
  const H = T + items.length * rowH + 34;
  const s = svgEl(W, H);
  const iw = W - L - R;
  const maxA = Math.max(...items.map((i) => Math.abs(i.v))) * 1.08;
  const xs = (v) => L + iw / 2 + (v / maxA) * (iw / 2);

  el("text", { x: VALX, y: T - 2, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s).textContent = "누적 손익";
  el("text", { x: VALX - 62, y: T - 2, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s).textContent = "플러스 폴드";
  [-maxA / 2, maxA / 2].forEach((v) => {
    el("line", { x1: xs(v), x2: xs(v), y1: T, y2: T + items.length * rowH, stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: xs(v), y: H - 10, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s).textContent = v.toFixed(0) + "%";
  });
  el("line", { x1: xs(0), x2: xs(0), y1: T, y2: T + items.length * rowH, stroke: CSS("--border"), "stroke-width": 1.5 }, s);
  el("text", { x: xs(0), y: H - 10, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s).textContent = "0";

  items.forEach((it, i) => {
    const y = T + i * rowH;
    el("text", { x: L - 12, y: y + rowH / 2 + 4, "text-anchor": "end", fill: it.v > 0 ? CSS("--ink") : CSS("--dim"), "font-size": 12.5 }, s)
      .textContent = it.label;
    const bh = 13, by = y + (rowH - bh) / 2;
    const x = it.v >= 0 ? xs(0) : xs(it.v);
    const wd = Math.max(1.5, Math.abs(xs(it.v) - xs(0)));
    const r = el("rect", { x, y: by, width: wd, height: bh, rx: 3, fill: it.v >= 0 ? CSS("--pos") : CSS("--neg") }, s);
    r.style.cursor = "crosshair";
    r.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(it.label)}</b><br>누적 OOS 손익 <b>${it.v > 0 ? "+" : ""}${it.v}%</b><br>${esc(it.tip)}`));
    r.addEventListener("mouseleave", hideTip);
    el("text", { x: VALX, y: by + bh - 2, "text-anchor": "end",
      fill: it.v >= 0 ? CSS("--pos") : CSS("--neg"), "font-size": 11.5, "font-weight": 600 }, s)
      .textContent = `${it.v > 0 ? "+" : ""}${it.v}%`;
    el("text", { x: VALX - 62, y: by + bh - 2, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = it.badge;
  });
  return s;
}

/** 자산곡선 여러 개 겹치기 — 로그 축. */
function curves(series) {
  const W = 1000, H = 340, L = 58, R = 20, T = 18, B = 40;
  const s = svgEl(W, H);
  const iw = W - L - R, ih = H - T - B;
  const all = series.flatMap((se) => se.pts);
  const t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(...all.map((p) => p.t));
  const eqs = all.map((p) => Math.max(p.equity, 1));
  const lo = Math.min(...eqs) * 0.85, hi = Math.max(...eqs) * 1.15;
  const xs = (t) => L + ((t - t0) / (t1 - t0)) * iw;
  const ys = (v) => T + ih - ((Math.log(Math.max(v, 1)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * ih;

  [25, 50, 100, 200, 400].filter((v) => v >= lo * 0.9 && v <= hi).forEach((v) => {
    el("line", { x1: L, x2: W - R, y1: ys(v), y2: ys(v), stroke: CSS("--grid"), "stroke-width": 1 }, s);
    el("text", { x: L - 8, y: ys(v) + 4, "text-anchor": "end", fill: CSS("--muted"), "font-size": 11 }, s).textContent = "$" + v;
  });
  el("line", { x1: L, x2: W - R, y1: ys(100), y2: ys(100), stroke: CSS("--border"), "stroke-width": 1.5, "stroke-dasharray": "5 4" }, s);

  series.forEach((se) => {
    const d = se.pts.map((p, i) => `${i ? "L" : "M"}${xs(p.t).toFixed(1)},${ys(p.equity).toFixed(1)}`).join(" ");
    el("path", { d, fill: "none", stroke: se.c, "stroke-width": se.w || 2, "stroke-linejoin": "round",
      "stroke-dasharray": se.dash || "none" }, s);
    const last = se.pts[se.pts.length - 1];
    el("text", { x: xs(last.t) - 4, y: ys(last.equity) - 8, "text-anchor": "end", fill: se.c, "font-size": 12, "font-weight": 640 }, s)
      .textContent = `${se.name} $${last.equity.toFixed(0)}`;
  });
  for (let i = 0; i <= 6; i++) {
    const t = t0 + ((t1 - t0) * i) / 6;
    el("text", { x: xs(t), y: H - 14, "text-anchor": "middle", fill: CSS("--muted"), "font-size": 11 }, s)
      .textContent = new Date(t).toISOString().slice(2, 7);
  }
  return s;
}

/* ---------- 본문 ---------- */

const kst = new Date(D.generatedAt + 9 * 3600e3).toISOString().slice(0, 10);
const R1 = D.rules.find((r) => r.rule === "R1"), R2 = D.rules.find((r) => r.rule === "R2");
const HB = D.hindsightBest;
const BH = D.buyHold;
const bestHonest = D.rules.map((r) => r.top).filter(Boolean).reduce((a, b) => (b.monthlyGeo > a.monthlyGeo ? b : a), { monthlyGeo: -99 });
const posFams = D.families.filter((f) => f.totalPct > 0);
const topFam = D.families[0];

add(`<div class="kicker">backtest-lab · 후속 회차 ${esc(kst)}</div>`);
add(`<h1>그래서 월 몇 %까지 되는가<br>— 그리고 어떤 지표로</h1>`);
add(`<p class="lede">앞 회차에서 월 10%는 기각됐다. 남은 질문은 "그럼 실제로 얼마까지, 무엇으로"다. 인샘플 랭킹으로 지표를 고르면 앞 회차가 보여준 대로 OOS에서 뒤집힌다. 그래서 여기서는 <b>지표를 고르는 대신 고르는 절차를 워크포워드로 검증</b>했다 — 창을 ${D.config.folds}등분하고, 각 시점에 그때까지의 정보만으로 부품을 뽑아 다음 구간에서 매매한 손익을 이어붙였다.</p>`);

add(`<div class="verdict">
  <span class="tag">답</span>
  <p><b>정직하게 손에 쥘 수 있었던 최대 월 복리는 마이너스다</b> — 선별 규칙 4종 전부 OOS 기대값이 음수였고, 낙폭 50% 이내 최선이 월 <b>${n2(bestHonest.monthlyGeo)}%</b>였다.</p>
  <p><b>어떤 지표가 잘될지 미리 알았다고 가정해도 상한은 월 +${n2(HB.monthlyGeo)}%</b>(낙폭 ${n1(HB.mdd)}%)다. 같은 구간 <b>BTC 매수보유는 월 +${n2(BH["4H"].monthlyGeo)}%</b>(낙폭 ${n1(BH.mdd)}%) — 위험조정으로 보면 <b>MAR ${n2(HB.mar)} 대 ${n2(BH.cagr / Math.abs(BH.mdd))}로 사실상 동률</b>이다.</p>
  <p>즉 <b>지표 선택이 완벽했더라도 그냥 사서 들고 있는 것보다 낫지 않았다.</b> 그것이 이 창에서 잰 천장이다.</p>
</div>`);

add(`<div class="tiles">
  <div class="tile bad"><div class="k">정직한 최대 (워크포워드)</div><div class="v">${n2(bestHonest.monthlyGeo)}%</div><div class="s">월 복리 · 낙폭 ${n1(bestHonest.mdd)}%</div></div>

  <li><b>다음 축은 OHLCV 밖이다.</b> 이 저장소에서 유일하게 t≥2.5를 낸 부품은 지표가 아니라 베이시스(스왑−현물 괴리, t=3.52)였다. 가격 파생 지표 31계열을 다 훑고도 t=2를 못 넘겼다는 것이 이번 회차의 실질적 결론이다.</li>
  <li><b>목표 재설정.</b> 이 창에서 무레버리지 매수보유가 월 +${n2(BH["4H"].monthlyGeo)}%다. 기술적 매매가 정당화되려면 이것을 <b>위험조정 기준으로</b> 넘어야 한다. 넘지 못하면 매매하지 않는 것이 최선의 전략이다.</li>
</ol>`);

/* §7 한계 */
add(`<h2><span class="num">7</span>한계</h2>`);
