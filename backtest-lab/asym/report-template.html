<title>하방 고정 상방 개방</title>
<style>
  /* 앞 12회차 리포트와 같은 토큰 — 형제 문서다. 계열색은 dataviz 검증 팔레트(4슬롯 PASS). */
  :root {
    color-scheme: dark;
    --bg: #0e1116; --surface: #161a21; --surface-2: #1e232c; --border: #2a3039;
    --ink: #e6e9ee; --dim: #8b95a3; --muted: #898781; --grid: #232935;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --pos: #3987e5; --neg: #e66767;
    --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
    --accent-soft: rgba(57, 135, 229, 0.14);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
      --ink: #14171c; --dim: #666e7a; --muted: #898781; --grid: #e8eaee;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
      --pos: #2a78d6; --neg: #e34948;
      --good: #0ca30c; --warn: #b57a00; --crit: #d03b3b;
      --accent-soft: rgba(42, 120, 214, 0.1);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
    --ink: #14171c; --dim: #666e7a; --muted: #898781; --grid: #e8eaee;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --pos: #2a78d6; --neg: #e34948;
    --good: #0ca30c; --warn: #b57a00; --crit: #d03b3b;
    --accent-soft: rgba(42, 120, 214, 0.1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 22px 96px; }
  h1 { font-size: 31px; line-height: 1.24; margin: 0 0 10px; letter-spacing: -0.02em; text-wrap: balance; }
  h2 { font-size: 20px; margin: 54px 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
  h2 .num { color: var(--dim); font-weight: 500; margin-right: 8px; font-variant-numeric: tabular-nums; }
  h3 { font-size: 15.5px; margin: 30px 0 8px; }
  p { margin: 10px 0; max-width: 74ch; }
  .lede { color: var(--dim); font-size: 16px; margin-bottom: 22px; max-width: 74ch; }
  .note { color: var(--dim); font-size: 13px; max-width: 80ch; }
  .eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 13px;
         font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  a { color: var(--s1); }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 3px; }
  strong { font-weight: 660; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 34px 0; }

  .verdict { border: 1px solid var(--border); border-left: 3px solid var(--warn);
    background: var(--surface); border-radius: 10px; padding: 18px 20px; margin: 22px 0 8px; }
  .verdict .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
  .verdict p { margin: 6px 0; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 12px; margin: 20px 0 6px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--dim); }
  .tile .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .tile.bad .v { color: var(--crit); }
  .tile.ok .v { color: var(--good); }
  .tile.hi { border-color: var(--warn); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin: 16px 0; }
  .card > h3:first-child { margin-top: 0; }
  .card.pick { border-left: 3px solid var(--good); }
  .card.cond { border-left: 3px solid var(--warn); }
  .card.avoid { border-left: 3px solid var(--crit); }
  .rank { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px;
    border-radius: 6px; background: var(--surface-2); color: var(--dim); font-size: 12.5px; font-weight: 700;
    margin-right: 9px; font-variant-numeric: tabular-nums; }
  .spec { font-size: 13px; color: var(--dim); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: var(--surface-2); border-radius: 6px; padding: 8px 10px; margin: 10px 0; overflow-x: auto; }
  .forag { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
  .forag > div { font-size: 13.5px; }
  .forag .h { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); font-weight: 650; margin-bottom: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 12px 0; }
  th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th.l, td.l { text-align: left; }
  thead th { color: var(--dim); font-weight: 600; font-size: 12.5px; background: var(--surface); }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr.hl { background: var(--accent-soft); }
  .scroll { overflow-x: auto; margin: 12px -4px; padding: 0 4px; }
  .chartbox { overflow-x: auto; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .pass { color: var(--good); font-weight: 650; } .fail { color: var(--crit); font-weight: 650; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
          border: 1px solid var(--border); color: var(--dim); margin-left: 5px; }
  .chip.new { color: var(--s2); border-color: var(--s2); }
  .chip.warnc { color: var(--warn); border-color: var(--warn); }
  .chip.okc { color: var(--good); border-color: var(--good); }

  figure { margin: 20px 0 8px; }
  figcaption { font-size: 13px; color: var(--dim); margin-top: 8px; max-width: 80ch; }
  .figtitle { font-size: 14.5px; font-weight: 620; margin-bottom: 2px; }
  .figsub { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; max-width: 80ch; }
  svg { display: block; max-width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--dim); margin: 4px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  details { margin: 12px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  summary { cursor: pointer; padding: 11px 16px; font-size: 13.5px; color: var(--dim); font-weight: 600; }
  details[open] summary { border-bottom: 1px solid var(--border); }
  details .body { padding: 4px 16px 14px; }
  ul, ol { max-width: 74ch; padding-left: 20px; }
  li { margin: 5px 0; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<div class="wrap" id="app"></div>
<script id="data" type="application/json">__DATA_JSON__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const app = document.getElementById("app");
  const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const add = (x) => app.appendChild(typeof x === "string" ? h(x) : x);
  const NS = "http://www.w3.org/2000/svg";
  const S = (tag, attrs = {}, kids = []) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, String(v));
    for (const k of [].concat(kids)) if (k) e.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    return e;
  };
  const txt = (x, y, s, o = {}) => S("text", { x, y, "font-size": o.size ?? 11.5, fill: o.fill ?? "var(--dim)",
    "text-anchor": o.anchor ?? "start", "font-weight": o.weight ?? 400, transform: o.transform,
    "font-variant-numeric": "tabular-nums" }, s);
  const tip = (s) => S("title", {}, s);
  const n2 = (v) => (v === null || v === undefined ? "—" : (Math.round(v * 100) / 100).toLocaleString("ko-KR", { maximumFractionDigits: 2 }));
  const n3 = (v) => (v === null || v === undefined ? "—" : (Math.round(v * 1000) / 1000).toFixed(3));
  const pc = (v, d = 2) => (v === null || v === undefined ? "—" : (v >= 0 ? "+" : "") + v.toFixed(d) + "%");
  const cls = (v) => (v === null || v === undefined ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "");
  const dt = (ms) => new Date(ms).toISOString().slice(0, 10);
  const dtm = (ms) => new Date(ms).toISOString().slice(0, 16).replace("T", " ");
  const mark = (b) => (b === true ? '<span class="pass">O</span>' : b === false ? '<span class="fail">X</span>' : '<span style="color:var(--dim)">—</span>');
  const fig = (title, sub, node, cap) => {
    const f = document.createElement("figure");
    f.appendChild(h('<div class="figtitle">' + title + "</div>"));
    if (sub) f.appendChild(h('<div class="figsub">' + sub + "</div>"));
    const box = h('<div class="chartbox"></div>'); box.appendChild(node); f.appendChild(box);
    if (cap) f.appendChild(h("<figcaption>" + cap + "</figcaption>"));
    return f;
  };
  const legend = (items) => '<div class="legend">' + items.map((i) => '<span><i style="background:' + i.c + '"></i>' + i.t + "</span>").join("") + "</div>";

  const SC = { P1: "var(--s1)", P4: "var(--s3)", P5: "var(--s4)", C0: "var(--dim)", P2: "var(--s2)", P6: "var(--s1)", P3: "var(--s4)" };
  const TFC = { "15m": "var(--s2)", "1H": "var(--s4)", "4H": "var(--s1)" };
  const bh4 = D.buyHold["4H"];

  /* ─────────────  머리말  ───────────── */
  add('<div class="eyebrow">BTC 백테스트 13회차 · 단기봉 비대칭 페이오프</div>');
  add("<h1>하방은 고정하고 상방은 열어두면, 단기봉에서 성립하는가</h1>");
  add('<p class="lede">기획 6종 · ' + D.rowCount.toLocaleString("ko-KR") + '조합 · 거래 ' +
    Object.values(D.byTf["4H"]).filter(Boolean).reduce((s, v) => s + v.n, 0).toLocaleString("ko-KR") +
    '건(4H) 전수. 사전 등록 게이트 7종, 엔진 자체 검사 7종, 대조군 3종(대칭 기하 · 랜덤 진입 · 매수보유). ' +
    '매매 시스템에는 아직 반영하지 않은 검토 자료다.</p>');

  const p6 = D.byTf["4H"].P6, p2 = D.byTf["4H"].P2, c0 = D.byTf["4H"].C0, p1 = D.byTf["4H"].P1;
  const pp6 = D.pairedByTf["4H"].P6.ev, pp1 = D.pairedByTf["4H"].P1.ev;

  add(h('<div class="verdict"><span class="tag">답</span>' +
    '<p><strong>절반은 성립한다.</strong> "손실을 하방으로 고정"은 완전히 작동했다 — 피라미딩을 뺀 모든 기획에서 ' +
    '가격 손절이 뚫린 거래가 <strong>43,000건 중 0건</strong>이다. 뚫은 것은 시장이 아니라 <strong>비용</strong>이었다.</p>' +
    '<p><strong>"수익을 길게"는 봉을 가린다.</strong> 4H에서는 비대칭 설계가 대칭 대조군을 유의하게 이긴다' +
    '(짝지은 18조합 중 ' + pp6.wins + '개 개선, t=' + pp6.t + '). 15m에서는 <em>오히려 진다</em>(t=' +
    D.pairedByTf["15m"].P1.ev.t + '). 단기봉일수록 유리하리라는 통념과 정반대다.</p>' +
    '<p><strong>그리고 크기와 안정성은 같은 편이 아니다.</strong> 전 구간 합산 1위(P6 · 상한고정 증량)는 ' +
    '최근 19개월에서 부호가 뒤집혔다. 세 구간 모두 대조군을 이긴 것은 <strong>가장 단순한 두 설계(P5 · P1)</strong>뿐이고, ' +
    '그 우위는 거래당 ' + pc(D.thirds.pairedThirds.P5[2].mean, 2) + ' 수준으로 작다.</p>' +
    '<p><strong>조합 하나하나는 여전히 소음과 구분되지 않는다.</strong> ' + D.multiple.eligible +
    '개 조합의 최대 t는 ' + D.multiple.maxT.toFixed(2) + '로 귀무 기대 ' + D.multiple.nullMaxT +
    '에 못 미쳤고, 다중검정 통과는 0건이다. 이 회차의 결과는 <em>설계 수준</em>에 있지 <em>설정 수준</em>에 있지 않다.</p></div>'));

  add(h('<div class="tiles">' +
    '<div class="tile ok"><div class="k">가격 손절이 뚫린 비율 · 4H P6</div><div class="v">' + n2(p6.breachGrossRate) + '%</div><div class="s">P2(무제한 증량)는 ' + n2(p2.breachGrossRate) + '%</div></div>' +
    '<div class="tile ok"><div class="k">평균이익 ÷ 평균손실 · 4H P6</div><div class="v">' + n2(p6.payoff) + '배</div><div class="s">대칭 대조군 C0는 ' + n2(c0.payoff) + '배</div></div>' +
    '<div class="tile hi"><div class="k">상위 5% 거래의 총이익 기여</div><div class="v">' + n2(p6.tailShare) + '%</div><div class="s">그 5%를 빼면 기대값 ' + n3(p6.evExTail) + '%</div></div>' +
    '<div class="tile bad"><div class="k">세 구간 모두 대조군 우위</div><div class="v">2 / 6</div><div class="s">P5 · P1만 — 크기 1위 P6은 3구간 ' + pc(D.thirds.pairedThirds.P6[2].mean, 2) + '</div></div>' +
    "</div>"));

  /* ─────────────  1. 우리  ───────────── */
  add('<h2><span class="num">1</span>먼저, 왜 이전 12회차는 이 질문에 답할 수 없었나</h2>');
  add("<p>데이터가 아니라 <strong>우리(cage)</strong> 때문이었다. 기존 엔진의 청산 6종 중 5종이 고정 목표가였고, 보유 한도가 " +
    "15m 3일 · 1H 5일 · 4H 10일로 묶여 있었다. <strong>러너가 존재할 수 없는 구조에서 “수익을 길게 가져가는가”를 물은 적이 없다.</strong> " +
    "이번 회차는 그 우리를 여는 것이 실험의 본체다.</p>");
  add(h('<div class="scroll"><table><thead><tr>' +
    '<th class="l">바뀐 것</th><th class="l">이전 12회차</th><th class="l">이번 회차</th><th class="l">왜</th>' +
    "</tr></thead><tbody>" +
    '<tr><td class="l">상방</td><td class="l">고정 목표가 1~9×ATR</td><td class="l">목표가 없음(대조군만 유지)</td><td class="l">목표가는 상방의 천장이다</td></tr>' +
    '<tr><td class="l">보유 한도</td><td class="l">15m 288봉 · 1H 120봉 · 4H 60봉</td><td class="l">15m ' + D.config.maxHold["15m"] + '봉 · 1H ' + D.config.maxHold["1H"] + '봉 · 4H ' + D.config.maxHold["4H"] + "봉</td><td class=\"l\">기존의 6~10배</td></tr>" +
    '<tr><td class="l">포지션 크기</td><td class="l">진입 후 불변</td><td class="l">부분익절(감소) · 피라미딩(증가)</td><td class="l">“길게”는 크기의 문제이기도 하다</td></tr>' +
    "</tbody></table></div>"));

  /* ─────────────  2. 검토 경로  ───────────── */
  add('<h2><span class="num">2</span>검토 경로 — 무엇을 읽고 무엇을 가져왔나</h2>');
  add("<p>기획은 상상이 아니라 인용에서 출발했다. 외부 문헌에서 설계를, 내부 12회차 원장에서 진입 계열을 가져왔다.</p>");
  add(h('<div class="scroll"><table><thead><tr><th class="l">출처</th><th class="l">가져온 것</th><th class="l">이번 회차에서 어떻게 시험했나</th></tr></thead><tbody>' +
    '<tr><td class="l">Chandelier Exit (LeBeau · Elder)</td><td class="l">22봉 최고가 − 3×ATR 추적, 절대 후퇴 없음</td><td class="l">P1의 청산 규칙 그대로</td></tr>' +
    '<tr><td class="l">Turtle Trading System</td><td class="l">0.5N마다 증량, 반대편 돈치안 이탈에서 청산</td><td class="l">P2 · P6의 증량 규칙</td></tr>' +
    '<tr><td class="l">Scale-out vs all-in 비교 연구</td><td class="l">부분익절은 PF를 올리고 기대값을 내린다는 통설</td><td class="l">P3으로 직접 검정 — 통설이 맞았다</td></tr>' +
    '<tr><td class="l">브레이크이븐 스톱 반증 연구</td><td class="l">조기 무손실화가 손실 수는 줄이되 0 결과를 폭증시킨다</td><td class="l">P5로 반대 가설을 같은 판에 올림</td></tr>' +
    '<tr><td class="l">MFE/MAE 기반 관리 (Sweeney)</td><td class="l">도달 시간 분포로 죽은 거래를 걸러낸다</td><td class="l">P4의 시간컷 · 전 기획의 MFE 포착률 측정</td></tr>' +
    '<tr><td class="l">내부 12회차 원장</td><td class="l">3회 독립 생존한 인사이드바, 워크포워드 상위 MACD, 터틀 정통 돈치안</td><td class="l">진입 8계열로 고정 — 진입은 이번 회차의 변수가 아니다</td></tr>' +
    "</tbody></table></div>"));
  add('<p class="note">진입 계열을 8개로 <em>고정</em>한 것이 설계의 핵심이다. 진입과 청산을 동시에 훑으면 무엇이 기여했는지 영원히 알 수 없다. ' +
    "이번 회차의 변수는 <strong>청산 설계 하나</strong>다.</p>");

  /* ─────────────  3. 기획 명세  ───────────── */
  add('<h2><span class="num">3</span>기획 6종 명세</h2>');
  const specLine = (p) => {
    const bits = ["초기 손절 " + p.initSl + "×ATR"];
    if (p.tp) bits.push("목표 " + p.tp + "×ATR");
    else bits.push("목표가 없음");
    if (p.trail) bits.push("추적 " + (p.trail.type === "chandelier" ? "샹들리에 22봉 − " + p.trail.mult + "×ATR" : p.trail.type === "atr" ? "ATR " + p.trail.mult + "배" : "돈치안 10봉"));

    });

  {

    ["P6", "P2", "P5", "P4", "P1", "P3", "C0"].map((k) => {

  // C2 — 누적 곡선 2종
  const curveChart = (keys, title, sub, cap) => {

    for (let i = 0; i <= 5; i += 1) {
